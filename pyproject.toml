[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roster-balance"
version = "0.1.0"
description = "Explainable roster planning and decision service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "mangum>=0.19,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/roster_balance"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
