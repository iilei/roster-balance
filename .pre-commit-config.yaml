repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-docstring-first
      - id: debug-statements
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: ["--unsafe"] # needed for !! tags in mkdocs.yml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Ruff replaces black, flake8, autoflake, isort and more
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "5ba58aca0bd5bc7c0e1c0fc45af2e88d6a2bde83"  # frozen: v0.14.10
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--config, ./pyproject.toml]

  - repo: local
    hooks:
      - id: mypy
        name: mypy (mise)
        entry: mise run typecheck
        language: system
        pass_filenames: false
  # - repo: local
  #   hooks:
  #     - id: version_in_readme
  #       name: version_in_readme
  #       entry: |-
  #         bash -c '\
  #           export LATEST_TAG=$(git tag  --contains $( git describe --tags $(git rev-list --tags --max-count=1) )) ;
  #           sed -Ei "s/(\s+)rev:.*/\1rev: "$( git rev-list -1 $LATEST_TAG  )"/" README.md && \
  #           sed -Ei "s/(\s+)rev: (\S+).*/\1rev: \2   \# "$LATEST_TAG"/" README.md'
  #       language: system
  #       pass_filenames: false
  - repo: local
    hooks:
      - id: generate_docs
        name: generate_docs
        entry: |-
          bash -c 'hatch run docs:openapi'
        language: system
        pass_filenames: false
