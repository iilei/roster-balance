services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      DATABASE_URL: postgresql+psycopg://roster_balance:roster_balance@postgres:5432/roster_balance
      TEAM_MAXIMUM: "1000000"
      TEAM_ID_SEED: "local-development"
      AUTHENTICATION_MODE: "local"
      INVITATION_TTL_HOURS: "4"
      INVITATION_RESEND_COOLDOWN_MINUTES: "15"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: roster_balance
      POSTGRES_USER: roster_balance
      POSTGRES_PASSWORD: roster_balance
    ports:
      - "5432:5432"
    volumes:
      - roster_balance_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster_balance -d roster_balance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roster_balance_postgres:
