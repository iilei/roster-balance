[tools]
python = "3.14.7"

[tasks.fmt]
description = "Format the project with Hatch"
run = ["hatch check code --fix", "hatch check fmt --fix"]

[tasks.typecheck]
description = "Run mypy against the project"
run = "hatch run typecheck"

[tasks.lint]
description = "Run static type and lint checks"
run = ["mise run typecheck", "hatch check code"]

[tasks.update]
description = "Rebuild lockfile from scratch"
run = [
  "rm -f uv.lock",
  "uv lock",
  "uv sync --all-extras --dev"
]

[tasks.test]
description = "Run the test suite with Hatch"
run = "hatch run pytest -q"

[tasks.openapi]
description = "Start the local OpenAPI server with Docker Compose"
run = "docker compose up --build api"
